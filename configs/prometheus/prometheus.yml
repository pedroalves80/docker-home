global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "homeassistant"
    scrape_interval: 30s
    metrics_path: /api/prometheus
    bearer_token_file: /prometheus/ha_token
    static_configs:
      - targets: ["homeassistant:8123"]

